name: Tests JavaScript

on:
  push:
    branches:
      - main
      - work/modularisation-phase-1
      - audit/bluetooth-hardening
      - chore/jsdoc-strict-typing
      - chore/test-first-hardening
  pull_request:
    branches:
      - main

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Vérifier la syntaxe de l’application
        run: find js tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier les types JSDoc
        run: npx --yes --package typescript@5.9.3 -- tsc --noEmit -p jsconfig.json
