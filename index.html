<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VMI – Application</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6b4f">
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#1d2a22;--mut:#5d6b62;--acc:#2f6b4f;--line:#d5dcd3;--warn:#a4411f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d2620;--ink:#e6ede8;--mut:#9baba0;--acc:#7fcf9f;--line:#2e3a32;--warn:#f0a07f;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .1em}
p.s{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.big{display:flex;gap:10px;flex-wrap:wrap}
.m{flex:1 1 120px}
.m b{display:block;font-size:1.9rem;line-height:1.1}
.m span{color:var(--mut);font-size:.85rem}
button, input[type="date"]{font:inherit;padding:10px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);margin:4px 4px 4px 0}
button.o, input[type="date"].o{background:transparent;color:var(--acc)}
button:disabled{opacity:.45}
#st{color:var(--mut);font-size:.9rem}
#err{color:var(--warn)}
.chart-container{position:relative}
svg{width:100%;height:auto;display:block;margin:6px 0;cursor:crosshair}
text{fill:var(--mut);font:10px Georgia,serif}
.g{stroke:var(--line);stroke-width:.5}
.tooltip{position:absolute;background:var(--ink);color:var(--bg);padding:4px 8px;font-size:11px;border-radius:4px;pointer-events:none;display:none;white-space:nowrap}
h2{
